rule: "Rule-based pilot page selection -> config/pilot_pages.yaml.\n\nIf config/pilot_pages.yaml already\
  \ exists it is used as is (never rewritten).\n\nRule (also recorded in the YAML):\n  Eligible Table\
  \ 5.2 pages: run label resolved, page half resolved, all 15\n  column boundaries found (structure detection\
  \ did not fail), and at least\n  MIN_INKED value cells containing ink (pages that are almost all blank\
  \ say\n  little about reading accuracy).\n  Rank eligible pages by legibility (docs/page_inventory.csv).\n\
  \    dev:     best, worst, and 2 of the 6 pages nearest the median\n    holdout: 2nd best, 2nd worst,\
  \ and 2 other pages near the median\n  Near-median: take the 6 eligible pages closest to the median\
  \ legibility,\n  shuffle them with random.Random(SEED); dev gets positions 0-1, holdout 2-3.\n  Table\
  \ 5.3: shuffle the tower pages with random.Random(SEED); dev gets the\n  first, holdout the second."

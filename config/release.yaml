# The comparison with the earlier transcription (built by scoring/reference_comparison.py),
# shipped as annotations/<file>. Described here rather than in src/publish/release.py, which
# must not name that transcription (tests/test_isolation.py).
comparison_file:
  file: reference_comparison.csv
  description: >
    Volume I cells where this dataset and J. S. Irwin's transcription (harmo.org) differ or
    differed before review, with the type of difference and who was right.
  fields:
    file: {type: string, description: "Dataset file the cell belongs to"}
    printed_token: {type: string, description: "The token as printed (this dataset)"}
    dataset_status:
      type: string
      description: "status of the cell in this dataset"
      enum: [value, not_measurable, missing, not_printed, text, code, illegible, unread]
    dataset_value: {type: number, description: "value of the cell in this dataset"}
    reference_file: {type: string, description: "File of J. S. Irwin's transcription (harmo.org) compared against"}
    reference_entry:
      type: string
      description: >
        The entry in that file, as written there (-9 = missing, 0.0 = no measurable
        concentration, per its own conventions)
    reference_reading:
      type: string
      description: "That entry interpreted with this dataset's status vocabulary"
      enum: [value, missing, not_measurable]
    reference_agrees_with_print: {type: boolean, description: "The entry equals what the page prints"}
    difference:
      type: string
      description: "Type of difference between the earlier transcription and the print"
      enum: [none, digit, magnitude, column_copy, post_assignment, printed_blank_coded_missing,
             printed_zero_coded_blank, value_missing_from_reference, reference_value_where_print_blank]
    ratio: {type: number, description: "earlier value / dataset value, where both are numbers"}
    reference_matches_suspected_alternative:
      type: boolean
      description: "The earlier file holds the value the owner suspects was intended (run 44, 800 m, post 69)"
    review_group: {type: string, description: "Review group of the 2026-11-15 owner review (A-D, BM)"}
    reviewed_by: {type: string, description: "Who reviewed the cell against the scan"}
    review_date: {type: date, description: "Date of that review"}
    reference_sha256: {type: string, description: "SHA-256 of the earlier transcription's file compared against"}

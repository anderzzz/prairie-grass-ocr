# Metadata of the data release (src/publish/release.py, make release).
# Also the source for the Zenodo record's metadata.

name: prairie-grass-1956
title: "Project Prairie Grass (1956): tracer concentrations and micrometeorology, transcribed cell by cell from the 1958 report"
version: "1.0.0"
date: null            # release date; null = the build date

description: >
  Machine-readable transcription of the data tables in Project Prairie Grass, A Field Program in
  Diffusion (Barad, ed., 1958; Geophysical Research Papers No. 59, Vols. I and II), the 1956 SO2
  tracer experiment near O'Neill, Nebraska that underlies much of near-field dispersion modelling.
  Volume I: concentrations on the five sampling arcs and six towers, release rates, evaporation
  correction factors, slow-response winds and run remarks. Volume II: micrometeorology at release
  times and hourly, heat budget, soil, optical temperature-gradient, rawinsonde and aircraft tables.
  Every value is the printed token, kept beside the parsed number, with its status (value,
  not measurable, missing, ...), how it was read and how well it is supported. Nothing is
  interpolated, smoothed or corrected; suspected errors in the 1958 original are marked with the
  evidence and a suggested alternative, never substituted.

creators:
  - name: "Anders Ohrn"          # TO CONFIRM: spelling as it should appear in the citation
    orcid: null                  # TO ADD
    roles: [creator]

keywords:
  - Project Prairie Grass
  - atmospheric dispersion
  - tracer experiment
  - sulfur dioxide
  - micrometeorology
  - surface layer
  - data rescue
  - digitization
  - 1956

sources:
  - title: "Barad, M. L. (ed.), 1958: Project Prairie Grass, A Field Program in Diffusion, Vol. I. Geophysical Research Papers No. 59, AFCRC-TR-58-235(I), Air Force Cambridge Research Center"
    url: https://harmo.org/jsirwin/PGrassVolumeI.pdf
  - title: "Barad, M. L. (ed.), 1958: Project Prairie Grass, A Field Program in Diffusion, Vol. II. Geophysical Research Papers No. 59, AFCRC-TR-58-235(II), Air Force Cambridge Research Center"
    url: https://harmo.org/jsirwin/PGrassVolumeII.pdf


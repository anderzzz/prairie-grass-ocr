[project]
name = "prairie-grass-ocr"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=2.8.0",
    "easyocr==1.7.2",
    "mistralai>=3.7.0",
    "numpy<2",
    "opencv-python-headless>=4.9,<5",
    "pillow>=13.0.0",
    "pymupdf>=1.24,<1.27",
    "pyyaml>=6.0.3",
    "torch==2.2.2",
    "torchvision==0.17.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "pandas>=3.0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extract", "scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
